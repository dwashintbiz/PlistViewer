name: Build Cross-Platform PListViewer (macOS, Windows, Linux)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_flag: --mac
            artifact_name: PListViewer-macOS
          - os: windows-latest
            platform_flag: --win
            artifact_name: PListViewer-Windows
          - os: ubuntu-latest
            platform_flag: --linux
            artifact_name: PListViewer-Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python build dependencies (PyInstaller)
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run Python Backend Unit Tests
        run: python backend/tests/test_backend.py -v

      - name: Build Standalone Python Backend Binary (PyInstaller)
        run: python scripts/build_backend.py

      - name: Install Node.js Dependencies
        run: npm install

      - name: Build Frontend & Electron Main Process
        run: npm run build

      - name: Package Electron Application (${{ matrix.os }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: warn
