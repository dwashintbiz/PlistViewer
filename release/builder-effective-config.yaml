directories:
  output: release
  buildResources: build
appId: com.dwashintbiz.plistviewer
productName: PListViewer
files:
  - filter:
      - dist/**/*
      - dist-electron/**/*
      - package.json
extraResources:
  - from: backend
    to: backend
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/build/**'
  - from: samples
    to: samples
win:
  target: nsis
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  target: AppImage
  category: Development
electronVersion: 31.7.7
